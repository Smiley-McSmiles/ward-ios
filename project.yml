name: Ward
options:
  bundleIdPrefix: org.ward
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.6"
    CURRENT_PROJECT_VERSION: "7"
targets:
  Ward:
    type: application
    platform: iOS
    sources:
      - path: WardiOS
    resources:
      - path: WardiOS/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ward.ios
        INFOPLIST_FILE: WardiOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: "-lsqlite3"
    info:
      path: WardiOS/Info.plist

# No external packages: Ward uses Network, Security, CryptoKit, SQLite3 and SwiftUI.
