name: Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build simulator app
        run: |
          xcodebuild \
            -project Ward.xcodeproj \
            -scheme Ward \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Capture
        run: ./scripts/screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Ward-app-store-screenshots
          path: fastlane/screenshots
