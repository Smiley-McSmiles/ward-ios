name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Ward for iOS Simulator
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Ward.xcodeproj \
            -scheme Ward \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log
      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ward-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/Ward.app
      - name: Capture App Store screenshots
        if: success()
        continue-on-error: true
        timeout-minutes: 12
        run: timeout 660 ./scripts/screenshots.sh
      - name: Upload screenshots
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Ward-app-store-screenshots
          path: fastlane/screenshots
