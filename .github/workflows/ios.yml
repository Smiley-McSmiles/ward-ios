name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Ward for iOS Simulator
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Ward.xcodeproj \
            -scheme Ward \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log
      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ward-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/Ward.app
      - name: Capture welcome screenshot
        if: success()
        continue-on-error: true
        run: |
          set -e
          DEVICE="iPhone 16"
          if ! xcrun simctl list devices available | grep -q "$DEVICE ("; then DEVICE="iPhone 15"; fi
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/Ward.app
          xcrun simctl launch "$DEVICE" org.ward.ios || true
          sleep 6
          xcrun simctl io "$DEVICE" screenshot welcome.png
      - name: Upload screenshot
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Ward-welcome-screenshot
          path: welcome.png
