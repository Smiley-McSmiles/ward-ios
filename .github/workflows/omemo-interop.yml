name: OMEMO interop

on:
  workflow_dispatch:
  push:
    paths:
      - "Packages/WardCrypto/**"
      - "Interop/**"
      - ".github/workflows/omemo-interop.yml"
  pull_request:
    paths:
      - "Packages/WardCrypto/**"
      - "Interop/**"
      - ".github/workflows/omemo-interop.yml"

jobs:
  twomemo:
    name: twomemo <-> WardCrypto
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reference backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install twomemo
      - name: Build interop helper
        run: swift build --package-path Interop
      - name: Run interoperability checks
        run: .venv/bin/python Interop/harness.py
      - name: Upload interop work files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: omemo-interop-work
          path: Interop/work
